site_name: Griglia
site_description: A Livewire dev board to queue and drive coding-agent work
site_url: https://github.com/alle80/griglia
repo_url: https://github.com/alle80/griglia
repo_name: alle80/griglia
docs_dir: docs
site_dir: site

theme:
  name: material
  logo: images/logo.svg
  favicon: images/favicon.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Home: index.md
  - Installation: installation.md
  - Using the board: usage.md
  - The agent side: agent.md
  - Features:
      - Plans: plans.md
      - Notifications: notifications.md
      - Agent context: context.md
      - Skills: skills.md
      - Statistics & agents status: stats.md
      - Themes: themes.md
  - Configuration & settings: configuration.md
  - Config inventory: config-and-settings.md
  - Security: security.md
  - Development: development.md
  - Building this site: docs-site.md
