name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, intl, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

      # The reference pages of the docs are generated from the code: fail when they were not refreshed.
      - name: Check the generated documentation
        run: |
          vendor/bin/testbench griglia:docs-generate --check || {
            vendor/bin/testbench griglia:docs-generate --out=/tmp/generated
            diff -u docs/reference /tmp/generated || true
            exit 1
          }
